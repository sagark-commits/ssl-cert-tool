[project]
name = "ssl-cert-tool"
version = "2.1.0"
description = "Parse customer certificate bundles, build deployment artifacts, and deploy them to servers over SSH."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sagar K" }]
dependencies = [
    "cryptography>=44.0.1",
    "paramiko>=3.4.0",
    "PyYAML>=6.0.1",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1.0"]
sevenzip = ["py7zr>=0.22.0"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["ssl_cert_tool", "ssl_deploy"]

[tool.setuptools.package-data]
ssl_cert_tool = ["bundled_roots/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
