name: build-mac

# Builds the standalone macOS binaries (GUI + CLI) with PyInstaller by running
# build-mac.sh. Runs on pushes to the mac-build branch, or by hand from the
# Actions tab. The zip is attached to the run as an artifact.

on:
  push:
    branches: [mac-build]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          chmod +x build-mac.sh
          ./build-mac.sh

      - name: Smoke test
        run: |
          set -e
          OUT=dist/SSLCertTool-Mac
          uname -m
          ls -la "$OUT"
          test -e "$OUT/SSLCertTool.app" -o -e "$OUT/SSLCertTool"
          "$OUT/ssl-auto" --version
          # Throwaway CA + leaf certificate, so the bundled crypto and JKS code run.
          mkdir -p smoke/in
          python -m pip install -q cryptography
          python - <<'EOF'
          import datetime
          from cryptography import x509
          from cryptography.x509.oid import NameOID
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          now = datetime.datetime.now(datetime.timezone.utc)
          def name(cn): return x509.Name([x509.NameAttribute(NameOID.COMMON_NAME, cn)])
          ck = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          ca = (x509.CertificateBuilder().subject_name(name("Smoke Test CA")).issuer_name(name("Smoke Test CA"))
                .public_key(ck.public_key()).serial_number(x509.random_serial_number())
                .not_valid_before(now).not_valid_after(now + datetime.timedelta(days=60))
                .add_extension(x509.BasicConstraints(ca=True, path_length=None), True)
                .sign(ck, hashes.SHA256()))
          lk = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          leaf = (x509.CertificateBuilder().subject_name(name("smoke.example.com")).issuer_name(ca.subject)
                  .public_key(lk.public_key()).serial_number(x509.random_serial_number())
                  .not_valid_before(now).not_valid_after(now + datetime.timedelta(days=30))
                  .add_extension(x509.SubjectAlternativeName([x509.DNSName("smoke.example.com")]), False)
                  .sign(ck, hashes.SHA256()))
          pem = serialization.Encoding.PEM
          open("smoke/in/smoke.example.com.crt", "wb").write(leaf.public_bytes(pem))
          open("smoke/in/ca.crt", "wb").write(ca.public_bytes(pem))
          open("smoke/smoke.example.com.key", "wb").write(lk.private_bytes(
              pem, serialization.PrivateFormat.TraditionalOpenSSL, serialization.NoEncryption()))
          EOF
          "$OUT/ssl-auto" generate --input smoke/in --key smoke/smoke.example.com.key \
              --output smoke/out -p smoketest-pass --no-color
          test -s smoke/out/smoke.example.com.jks

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 SSLCertTool-Mac.zip | tee SSLCertTool-Mac.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SSLCertTool-Mac-${{ runner.arch }}
          path: |
            dist/SSLCertTool-Mac.zip
            dist/SSLCertTool-Mac.zip.sha256
          if-no-files-found: error
