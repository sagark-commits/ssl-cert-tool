# SSL Deployment Configuration Template
# =====================================
# Copy this file and customize for your environment:
#   cp configs/template.yaml configs/mycompany.yaml
#
# Then use with: python ssl-auto.py run --config configs/mycompany.yaml ...

# Domain name (optional - auto-detected from certificate CN if not specified)
# Use this to override or confirm the expected domain
domain: ""  # e.g., example.com, *.example.com, mail.example.com

# Keystore settings (for JKS/P12 generation)
keystore:
  password: "changeit"  # IMPORTANT: change this for production, and prefer not to store it in
                        # this file: use  password: ${env:KEYSTORE_PASSWORD}  (read at run time)
  alias: "server-cert"  # Key alias in the keystore

# SSH defaults (can be overridden per server)
ssh:
  user: "root"           # Default SSH user
  port: 22               # Default SSH port
  key: "~/.ssh/id_rsa"   # Default SSH key path (~ expands on all platforms)
  # password: ${env:SSH_PASSWORD}   # never write a literal password here
  #
  # Reaching a server through a bastion: on a server entry set either
  #   ssh_alias: my-alias          # take HostName/Port/User/ProxyJump from ~/.ssh/config
  #   proxy_jump: bastion          # another server in this file, an ssh-config alias, or user@host:port
  #   proxy_jump: [jump1, jump2]   # several hops, in connect order
  # (config_file: below points at a different OpenSSH config than ~/.ssh/config)
  # config_file: ~/.ssh/config
  #
  # Host-key checking. "strict" (default) refuses servers whose key is not already in
  # ~/.ssh/known_hosts or ~/.ssl-auto/known_hosts and prints the fingerprint to verify.
  # "accept-new" trusts and remembers a server on first contact (same as the
  # --accept-new-hostkeys flag). A CHANGED key is always refused. To pin a server instead,
  # set  host_key_sha256: "SHA256:..."  on that server (or here, as a default).
  host_key_policy: strict

# Where each deploy snapshots the files it overwrites (used by `rollback`).
# Must be an absolute path; it is created 0700 and must be owned by the SSH user.
# The default (/tmp/ssl-deploy-backups) is cleared on reboot - use a durable path for production.
# backup_dir: /var/backups/ssl-auto

# =============================================================================
# SERVER DEFINITIONS
# =============================================================================
# Define your servers and which services run on each.
# Server names are arbitrary identifiers used in deploy output.
#
# Each server needs:
#   - host: hostname or IP address
#   - user: (optional) SSH user, defaults to ssh.user above
#   - port: (optional) SSH port, defaults to 22
#   - key_file: (optional) SSH key path, defaults to ssh.key above
#   - services: list of service names to deploy to this server
#   - host_key_sha256: (optional) pin the server's SSH host key, e.g. "SHA256:3qB..."
#   - ssh_alias / proxy_jump: (optional) reach it via ~/.ssh/config or jump hosts (see ssh: above);
#     in that case `host` may be omitted when ssh_alias provides it

servers:
  # Example: Application server with Tomcat
  # app_server:
  #   host: "192.168.1.10"
  #   user: "deploy"
  #   services:
  #     - tomcat

  # Example: Web server with Apache/Nginx
  # web_server:
  #   host: "192.168.1.20"
  #   user: "root"
  #   services:
  #     - apache
  #     - nginx

  # Example: VoIP server with Asterisk
  # voip_server:
  #   host: "192.168.1.30"
  #   services:
  #     - asterisk

# =============================================================================
# SERVICE DEFINITIONS
# =============================================================================
# Define how certificates are deployed for each service type.
# Service names must match those referenced in servers above.
#
# Supported types: jks, apache, nginx, asterisk, custom

services:
  # ---------------------------------------------------------------------------
  # JKS-based service (Tomcat, Jetty, Spring Boot, etc.)
  # ---------------------------------------------------------------------------
  # tomcat:
  #   type: jks
  #   remote_path: /opt/tomcat/conf/keystore.jks
  #   restart: "systemctl restart tomcat"
  #
  # For Ameyo/custom Java apps:
  # appserver:
  #   type: jks
  #   remote_path: /app/ssl/server.jks
  #   restart: "ameyoctl service appserver faststop && sleep 5 && ameyoctl service appserver start"

  # ---------------------------------------------------------------------------
  # Apache/httpd service
  # ---------------------------------------------------------------------------
  # apache:
  #   type: apache
  #   ssl_dir: /etc/httpd/ssl/           # All cert files in one directory
  #   cert_file: server.crt              # Certificate filename
  #   key_file: server.key               # Private key filename
  #   chain_file: ca-bundle.crt          # CA chain filename
  #   restart: "systemctl reload httpd"
  #
  # Alternative: separate cert/key directories
  # apache_split:
  #   type: apache
  #   cert_path: /etc/pki/tls/certs/
  #   key_path: /etc/pki/tls/private/
  #   cert_file: server.crt
  #   key_file: server.key
  #   chain_file: ca-bundle.crt
  #   restart: "apachectl graceful"

  # ---------------------------------------------------------------------------
  # Nginx service
  # ---------------------------------------------------------------------------
  # nginx:
  #   type: nginx
  #   cert_path: /etc/nginx/ssl/
  #   cert_file: fullchain.pem           # Optional: defaults to {domain}.crt
  #   key_file: privkey.pem              # Optional: defaults to {domain}.key
  #   restart: "systemctl reload nginx"

  # ---------------------------------------------------------------------------
  # Asterisk VoIP service
  # ---------------------------------------------------------------------------
  # asterisk:
  #   type: asterisk
  #   cert_dir: /etc/asterisk/keys/
  #   restart: "asterisk -rx 'module reload res_pjsip.so'"

  # ---------------------------------------------------------------------------
  # Custom service (explicit file mappings)
  # ---------------------------------------------------------------------------
  # custom_app:
  #   type: custom
  #   file_mappings:
  #     certificate: /app/certs/server.crt
  #     private_key: /app/certs/server.key
  #     chain: /app/certs/ca-bundle.crt   # a value can also be a list of paths,
  #     jks: /app/certs/keystore.jks      # to write one source under 2+ names
  #   restart: "systemctl restart myapp"

  # ---------------------------------------------------------------------------
  # Optional fields on ANY service: hooks + priority
  # ---------------------------------------------------------------------------
  # hooks: shell commands to run on the host after all of that host's file
  #   uploads succeed, but before restarts. Useful for verification or for
  #   importing a cert into another store (e.g. the JVM truststore).
  #   If two services on the SAME server define the exact same hook string,
  #   it still only runs once for that host.
  #
  # verify_tls: after the restart, handshake with the service and confirm it now serves the
  #   certificate that was just deployed (retries while the service comes up). Needs the
  #   TLS port to be reachable from this machine. `host` defaults to the server's host.
  #     verify_tls: {port: 8443}
  #     verify_tls: [{port: 8443}, {port: 9443, servername: app.example.com, attempts: 10, delay: 3}]
  #
  # Safety behaviour (no configuration needed): all destination paths must be absolute; a
  # failing hook stops the restarts and restores the files; a JKS service must open on the
  # server with the configured password/alias before anything is restarted.
  #
  # priority: controls restart ORDER when a server has multiple services
  #   (ascending, default 50) - e.g. restart an app server before a
  #   dependent report server. Two services with the identical restart
  #   command on the same server only trigger it once.
  #
  # appserver:
  #   type: jks
  #   remote_path: /app/ssl/server.jks
  #   restart: "ameyoctl service appserver faststop && sleep 5 && ameyoctl service appserver start"
  #   priority: 10
  #   hooks:
  #     - |
  #       keytool -delete -alias server-cert -keystore /path/to/cacerts -storepass changeit || true
  #       keytool -importkeystore -srckeystore /app/ssl/server.jks -destkeystore /path/to/cacerts \
  #         -srcstoretype JKS -deststoretype JKS -srcstorepass changeit -deststorepass changeit -noprompt
  #
  # # A second service reading the SAME keystore path: uploaded/backed up once,
  # # its hooks are deduped against appserver's, and it restarts after it.
  # tomcat_si:
  #   type: jks
  #   remote_path: /app/ssl/server.jks
  #   priority: 20

# =============================================================================
# CERTIFICATE MAPPINGS (optional, advanced)
# =============================================================================
# Override how generated files map to remote destinations.
# Most deployments don't need this - the service type handles it automatically.
#
# cert_mappings:
#   - source: "{domain}.jks"
#     destination: /path/to/keystore.jks
#     services: [tomcat]
#   - source: "main_{domain}.crt"
#     destination: /path/to/server.crt
#     services: [apache]
